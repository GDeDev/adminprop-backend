services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Sólo para desarrollo local. En cualquier otro entorno, credenciales
      # reales inyectadas desde afuera (Doppler).
      POSTGRES_DB: adminprop_development
      POSTGRES_USER: adminprop
      POSTGRES_PASSWORD: adminprop
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea la base de tests e2e junto con la de desarrollo.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - api_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adminprop -d adminprop_development']
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [dev, prod]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Los secretos (JWT_*, DATABASE_URL) salen del .env local, no del compose.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://adminprop:adminprop@postgres:5432/adminprop_development
      TRUST_PROXY: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api_network
    profiles: [prod]

volumes:
  postgres_data:

networks:
  api_network:
    driver: bridge
