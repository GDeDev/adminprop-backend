services:
  mariadb:
    image: mariadb:11.2
    restart: unless-stopped
    environment:
      # Sólo para desarrollo local. En cualquier otro entorno, credenciales
      # reales inyectadas desde afuera.
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: api_development
      MARIADB_USER: api_user
      MARIADB_PASSWORD: api_password
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - api_network
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: [dev, prod]

  # Todavía no lo usa nadie. Está listo para cuando muevas el rate limiting o
  # una caché a un storage compartido — ver src/shared/infra/throttler/.
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - api_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: [dev, prod]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Los secretos (JWT_*, DATABASE_URL) salen del .env local, no del compose.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://api_user:api_password@mariadb:3306/api_development
      TRUST_PROXY: 'false'
    ports:
      - '3000:3000'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api_network
    profiles: [prod]

volumes:
  mariadb_data:
  redis_data:

networks:
  api_network:
    driver: bridge
