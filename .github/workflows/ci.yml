name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores descartables sólo para que pase la validación de entorno.
  # Los secretos reales nunca van en el workflow.
  NODE_ENV: test
  DATABASE_URL: postgresql://adminprop:adminprop@127.0.0.1:5432/adminprop_test
  JWT_ACCESS_SECRET: ci-access-secret-descartable-de-al-menos-32-caracteres
  JWT_REFRESH_SECRET: ci-refresh-secret-descartable-de-al-menos-32-caracteres
  BCRYPT_SALT_ROUNDS: '10'
  THROTTLE_ENABLED: 'false'

jobs:
  quality:
    name: Formato, lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Tipos
        run: npx tsc --noEmit

      - name: Contrato OpenAPI al día
        # El frontend genera sus tipos desde openapi.json. Si cambió un DTO y
        # nadie corrió `npm run openapi:export`, el front quedaría desfasado.
        run: npm run openapi:export && git diff --exit-code -- openapi.json

  security:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm audit
        # Sólo alta y crítica: en `moderate` el ruido de dependencias
        # transitivas hace que el equipo aprenda a ignorar el job, que es peor
        # que no tenerlo.
        run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adminprop_test
          POSTGRES_USER: adminprop
          POSTGRES_PASSWORD: adminprop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U adminprop -d adminprop_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Tests unitarios
        run: npm run test:unit -- --coverage

      - name: Tests e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build

      - name: Build de la imagen Docker
        run: docker build -t api:${{ github.sha }} .
